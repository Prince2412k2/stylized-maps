services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      OPENROUTESERVICE_API_KEY: "${OPENROUTESERVICE_API_KEY:?OPENROUTESERVICE_API_KEY is required}"
      PORT: "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health"]
      interval: 15s
      timeout: 3s
      retries: 3
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - "${MAP_WEB_ROOT:?MAP_WEB_ROOT must point to the generated web root}:/srv/assets:ro"
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
