services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      OPENROUTESERVICE_API_KEY: "${OPENROUTESERVICE_API_KEY:?OPENROUTESERVICE_API_KEY is required}"
      PORT: "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health"]
      interval: 15s
      timeout: 3s
      retries: 3
    security_opt:
      - no-new-privileges:true
    expose:
      - "3000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      # HTTP only: the existing Caddy on caddy-proxy terminates TLS and
      # reverse-proxies to this service. ":80" makes the embedded Caddy
      # listen on 0.0.0.0:80 without attempting ACME/HTTPS.
      DOMAIN: "${DOMAIN:-:80}"
    expose:
      - "80"
    volumes:
      - "${MAP_WEB_ROOT:?MAP_WEB_ROOT must point to the generated web root}:/srv/assets:ro"
    networks:
      - default
      - caddy-proxy
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  caddy-proxy:
    external: true
